<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Soichi Hayashi — Brain MRI Viewer</title>
    <link rel="stylesheet" type="text/css" href="papaya.css" />
    <script type="text/javascript" src="papaya.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        height: 100%;
      }

      .page-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        padding: 10px 14px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #ddd;
        background: linear-gradient(to bottom, rgba(0, 0, 0, 0.65), transparent);
        pointer-events: none;
      }

      .page-header a {
        color: #9cf;
        pointer-events: auto;
      }
    </style>
    <script type="text/javascript">
      var params = [];
      params["images"] = ["t1.nii.gz", "aparc+aseg.rgb.nii.gz"];
      params["aparc+aseg.rgb.nii.gz"] = {
        alpha: 0.65
      };
    </script>
  </head>

  <body>
    <div class="page-header">
      My T1 anatomical MRI with the FreeSurfer <code>aparc+aseg</code>
      segmentation overlay, viewed with the
      <a href="https://github.com/rii-mango/Papaya" target="_blank" rel="noopener">Papaya</a>
      viewer. More about me: <a href="https://hayashi.in">hayashi.in</a>
    </div>
    <div class="papaya" data-params="params"></div>
  </body>
</html>
